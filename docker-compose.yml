services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: url_shortener_app
    ports:
      - "8090:80"
    volumes:
      - ./app:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-url_shortener}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shortener_net

  db:
    image: mysql:8.0
    container_name: url_shortener_db
    ports:
      - "3320:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-url_shortener}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortener_net

  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    networks:
      - shortener_net

volumes:
  db_data:
  redis_data:

networks:
  shortener_net:
    driver: bridge
